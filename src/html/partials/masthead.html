<header class="masthead">
    <a class="mast-brand" href="#intro" aria-label="Rolando Luayon, back to top">
        <span class="brand-square" aria-hidden="true"></span>
        <span class="brand-name">Rolando Luayon</span>
        <span class="brand-sub">Portfolio / 2026</span>
    </a>

    <p class="mast-sheet">
        Sheet <span data-sheet-current>00</span> / 04
        <span data-sheet-label>Identity</span>
    </p>

    <div class="mast-actions">
        <p class="mast-clock"><span class="clock-dot" aria-hidden="true"></span> Davao <time
                id="localClock">--:--</time></p>
        <button class="index-toggle" id="indexToggle" type="button" aria-expanded="false"
            aria-controls="indexOverlay">
            <span>Index</span>
            <span class="index-icon" aria-hidden="true"><span></span><span></span></span>
        </button>
    </div>
</header>
